<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFC93C">
<meta name="description" content="ჩემი განვლილი ინგლისური მასალა — ბარათებით და ტესტით გამეორება.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My English">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>My English</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap">
<style>
  :root{
    --yellow:#FFC93C;
    --yellow-dark:#E8B01F;
    --navy:#1b2438;
    --navy-soft:#3b4663;
    --white:#ffffff;
    --line:#e6e1d4;
    --green:#1f9d55;
    --red:#d64545;
    --shadow:0 4px 14px rgba(27,36,56,.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--yellow); color:var(--navy);
    font-family:"Noto Sans Georgian","Segoe UI",system-ui,sans-serif;
    font-size:16px; line-height:1.45;
  }
  .wrap{
    max-width:430px; margin:0 auto; min-height:100vh;
    padding:14px 16px calc(28px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
  }

  /* ── სათაური ── */
  .top{display:flex; align-items:center; gap:10px; margin-bottom:14px; min-height:40px}
  .back{
    flex:0 0 auto; width:40px; height:40px; border:none; border-radius:12px;
    background:rgba(255,255,255,.55); color:var(--navy); font-size:20px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .back:active{background:rgba(255,255,255,.9)}
  .ttl{font-size:19px; font-weight:700; line-height:1.2; flex:1 1 auto}
  .ttl small{display:block; font-size:12px; font-weight:500; opacity:.72; margin-top:2px}
  .logo{font-size:26px; font-weight:700; letter-spacing:-.5px}
  .logo span{background:var(--navy); color:var(--yellow); padding:0 8px; border-radius:10px}

  /* ── კუბიკები ── */
  .cubes{display:flex; flex-direction:column; gap:12px}
  .cube{
    display:block; width:100%; text-align:left; border:none; cursor:pointer;
    background:var(--white); border-radius:18px; padding:16px 18px;
    box-shadow:var(--shadow); color:var(--navy); font-family:inherit;
  }
  .cube:active{transform:scale(.985)}
  .cube .ic{font-size:26px; line-height:1}
  .cube .nm{font-size:18px; font-weight:700; margin-top:6px}
  .cube .ds{font-size:13px; opacity:.7; margin-top:2px}
  .cube .mt{font-size:13px; margin-top:8px; display:flex; gap:12px; flex-wrap:wrap}
  .mt b{font-weight:600}
  .mt .kn{color:var(--green); font-weight:700}
  .cube.flat{background:rgba(255,255,255,.6); box-shadow:none; border:1px dashed rgba(27,36,56,.25)}

  .bar{height:7px; background:#eee8d8; border-radius:99px; overflow:hidden; margin-top:10px}
  .bar i{display:block; height:100%; background:var(--green); border-radius:99px; transition:width .3s}

  .empty{
    background:rgba(255,255,255,.6); border:1px dashed rgba(27,36,56,.3);
    border-radius:16px; padding:18px; font-size:14px; text-align:center; opacity:.85;
  }

  /* ── რეჟიმის არჩევა ── */
  .seg{display:flex; gap:8px; background:rgba(255,255,255,.5); padding:5px; border-radius:14px; margin-bottom:14px}
  .seg button{
    flex:1; border:none; background:transparent; font-family:inherit; font-size:14px;
    font-weight:600; color:var(--navy); padding:9px 4px; border-radius:10px; cursor:pointer;
  }
  .seg button.on{background:var(--navy); color:var(--yellow)}
  .hint{font-size:12.5px; opacity:.75; margin:-6px 0 14px; text-align:center}

  .btn{
    border:none; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer;
    background:var(--navy); color:var(--yellow); border-radius:14px; padding:14px;
    width:100%; box-shadow:var(--shadow);
  }
  .btn.ghost{background:var(--white); color:var(--navy); box-shadow:none; border:1px solid var(--line)}
  .btn:active{opacity:.85}
  .row{display:flex; gap:10px}
  .row > *{flex:1}

  /* ── ბარათი ── */
  .count{text-align:center; font-size:13px; font-weight:600; opacity:.8; margin-bottom:8px}
  .card{
    background:var(--white); border-radius:22px; box-shadow:var(--shadow);
    min-height:260px; padding:24px 20px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; cursor:pointer;
    position:relative; margin-bottom:14px;
  }
  .card .side{font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.45; position:absolute; top:14px; left:0; right:0}
  .card .main{font-size:25px; font-weight:700; line-height:1.3; word-break:break-word}
  .card .main.ge{font-size:23px}
  .card .ans{font-size:22px; font-weight:700; color:var(--navy); line-height:1.35}
  .card .ex{font-size:14.5px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); opacity:.9; font-style:italic}
  .card .exka{font-size:13.5px; margin-top:5px; opacity:.65}
  .card .tap{position:absolute; bottom:14px; left:0; right:0; font-size:12px; opacity:.45}
  .spk{
    position:absolute; top:12px; right:12px; width:40px; height:40px; border-radius:50%;
    border:none; background:var(--yellow); color:var(--navy); font-size:19px; cursor:pointer;
  }
  .badge{position:absolute; top:14px; left:14px; font-size:12px; font-weight:700; color:var(--green)}

  /* ── ტესტი ── */
  .q{
    background:var(--white); border-radius:18px; box-shadow:var(--shadow);
    padding:20px 18px; text-align:center; font-size:22px; font-weight:700; margin-bottom:12px;
    position:relative; min-height:86px; display:flex; align-items:center; justify-content:center;
  }
  .q.ge{font-size:20px}
  .opts{display:flex; flex-direction:column; gap:9px}
  .opt{
    border:1px solid var(--line); background:var(--white); color:var(--navy);
    font-family:inherit; font-size:15.5px; text-align:left; padding:13px 15px;
    border-radius:14px; cursor:pointer; line-height:1.35;
  }
  .opt:disabled{cursor:default}
  .opt.right{background:#e7f7ec; border-color:var(--green); font-weight:700}
  .opt.wrong{background:#fdeaea; border-color:var(--red)}
  .fb{
    margin-top:12px; background:var(--white); border-radius:14px; padding:14px 16px;
    font-size:14px; box-shadow:var(--shadow);
  }
  .fb .ok{color:var(--green); font-weight:700}
  .fb .no{color:var(--red); font-weight:700}
  .fb .belongs{margin-top:8px; padding-top:8px; border-top:1px solid var(--line)}
  .fb b{font-weight:700}

  .score{
    background:var(--white); border-radius:18px; box-shadow:var(--shadow);
    padding:24px; text-align:center; margin-bottom:14px;
  }
  .score .big{font-size:42px; font-weight:700; line-height:1.1}
  .score .sub{font-size:14px; opacity:.75; margin-top:6px}

  .foot{margin-top:auto; padding-top:20px; font-size:11.5px; text-align:center; opacity:.6}
  .mini{
    border:none; background:transparent; font-family:inherit; font-size:13px;
    color:var(--navy); opacity:.7; text-decoration:underline; cursor:pointer; padding:6px;
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="data.js"></script>
<script>
"use strict";

/* ═════════ მდგომარეობა ═════════ */
const KEY = "myeng.know.v1";
let know = {};
try { know = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { know = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(know)); } catch(e){} }

/* ბარათის გასაღები: section|group|ინგლისური ტექსტი — ადგილის შეცვლა პროგრესს არ აფუჭებს */
function ck(sec, grp, card){ return sec.id + "|" + grp.id + "|" + card.en; }
function st(key){ return know[key] || {}; }
function knownIn(key, dir){ return !!st(key)[dir]; }          // dir: "en" ან "ka"
function knownBoth(key){ const s = st(key); return !!s.en && !!s.ka; }
function mark(key, dir){
  const s = know[key] || (know[key] = {});
  s[dir] = 1; save();
}
function unmark(key){ delete know[key]; save(); }

/* ═════════ დათვლა ═════════ */
function groupCards(sec, grp){ return grp.cards || []; }
function allCards(sec){
  const out = [];
  (sec.groups || []).forEach(g => (g.cards || []).forEach(c => out.push({ grp:g, card:c })));
  return out;
}
function countKnown(sec, list){
  let full = 0, half = 0;
  list.forEach(x => {
    const key = ck(sec, x.grp, x.card);
    if (knownBoth(key)) full++;
    else if (st(key).en || st(key).ka) half++;
  });
  return { full, half };
}

/* ═════════ ხმა (ამერიკული აქცენტი) ═════════ */
let voices = [];
function loadVoices(){ try { voices = speechSynthesis.getVoices() || []; } catch(e){ voices = []; } }
if (window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function say(text){
  if (!window.speechSynthesis || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = .9;
    const v = voices.find(v => /en[-_]US/i.test(v.lang) && /female|samantha|zira|aria|jenny/i.test(v.name))
           || voices.find(v => /en[-_]US/i.test(v.lang))
           || voices.find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e){}
}

/* ═════════ ხელსაწყოები ═════════ */
const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function shuffle(a){ const r = a.slice(); for (let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function plural(n){ return n + " ბარათი"; }

/* ═════════ ეკრანები ═════════ */
let view = { name:"home" };
let dir = "en";            // "en" = ინგლისურიდან ქართულად · "ka" = ქართულიდან ინგლისურად
try { dir = localStorage.getItem("myeng.dir") || "en"; } catch(e){}

function go(v){ view = v; render(); window.scrollTo(0,0); }

function render(){
  const n = view.name;
  if (n === "home") return home();
  if (n === "section") return section();
  if (n === "group") return groupMenu();
  if (n === "cards") return cards();
  if (n === "quiz") return quiz();
  if (n === "progress") return progress();
  home();
}

/* ── მთავარი ── */
function home(){
  let total = 0, tFull = 0;
  const cubes = DATA.sections.map(sec => {
    const list = allCards(sec);
    const k = countKnown(sec, list);
    total += list.length; tFull += k.full;
    const gN = (sec.groups || []).length;
    return `<button class="cube" data-sec="${esc(sec.id)}">
      <div class="ic">${sec.icon}</div>
      <div class="nm">${esc(sec.name)}</div>
      <div class="ds">${esc(sec.note || "")}</div>
      <div class="mt">
        <span><b>${gN}</b> ჯგუფი</span>
        <span><b>${list.length}</b> ბარათი</span>
        ${k.full ? `<span class="kn">🏆 ${k.full}</span>` : ``}
      </div>
    </button>`;
  }).join("");

  app.innerHTML = `
    <div class="top">
      <div class="ttl"><div class="logo">My <span>English</span></div>
        <small>ჩემი განვლილი მასალა — ბარათებით და ტესტით</small></div>
    </div>
    <div class="cubes">${cubes}
      <button class="cube flat" data-go="progress">
        <div class="ic">📊</div>
        <div class="nm">პროგრესი</div>
        <div class="mt"><span>სულ <b>${total}</b> ბარათი</span><span class="kn">🏆 ${tFull} ვიცი</span></div>
      </button>
    </div>
    <div class="foot">ბარათის წინა მხარეს პასუხი არ ჩანს — თვითონ დაფიქრდი, მერე დააჭირე.</div>`;

  app.querySelectorAll("[data-sec]").forEach(b =>
    b.onclick = () => go({ name:"section", sec:b.dataset.sec }));
  app.querySelector("[data-go=progress]").onclick = () => go({ name:"progress" });
}

function findSec(id){ return DATA.sections.find(s => s.id === id); }

/* ── განყოფილება: ჯგუფების სია ── */
function section(){
  const sec = findSec(view.sec);
  if (!sec) return go({ name:"home" });
  const groups = sec.groups || [];

  let body;
  if (!groups.length){
    body = `<div class="empty">ამ განყოფილებაში ჯგუფი ჯერ არ არის.<br>
      მითხარი რა ჯგუფები უნდა იყოს და დაგიმატებ.</div>`;
  } else {
    const all = allCards(sec);
    const ka = countKnown(sec, all);
    body = `<div class="cubes">
      ${groups.map(g => {
        const list = g.cards.map(c => ({ grp:g, card:c }));
        const k = countKnown(sec, list);
        const pct = list.length ? Math.round(k.full / list.length * 100) : 0;
        return `<button class="cube" data-grp="${esc(g.id)}">
          <div class="nm">${esc(g.name)}</div>
          <div class="mt"><span><b>${list.length}</b> ბარათი</span>
            ${k.full ? `<span class="kn">🏆 ${k.full}</span>` : ``}
            ${k.half ? `<span>½ ${k.half}</span>` : ``}</div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </button>`;
      }).join("")}
      ${groups.length > 1 ? `<button class="cube flat" data-grp="__all">
        <div class="nm">🎲 ყველა ჯგუფი ერთად</div>
        <div class="mt"><span><b>${all.length}</b> ბარათი</span>
          ${ka.full ? `<span class="kn">🏆 ${ka.full}</span>` : ``}</div>
      </button>` : ``}
    </div>`;
  }

  app.innerHTML = `
    <div class="top">
      <button class="back" data-back>←</button>
      <div class="ttl">${sec.icon} ${esc(sec.name)}<small>${esc(sec.note || "")}</small></div>
    </div>${body}`;

  app.querySelector("[data-back]").onclick = () => go({ name:"home" });
  app.querySelectorAll("[data-grp]").forEach(b =>
    b.onclick = () => go({ name:"group", sec:sec.id, grp:b.dataset.grp }));
}

/* ── არჩეული მასალა ── */
function pool(){
  const sec = findSec(view.sec);
  if (!sec) return { sec:null, list:[], title:"" };
  if (view.grp === "__all") return { sec, list:allCards(sec), title:"ყველა ჯგუფი" };
  const g = (sec.groups || []).find(x => x.id === view.grp);
  if (!g) return { sec, list:[], title:"" };
  return { sec, list:g.cards.map(c => ({ grp:g, card:c })), title:g.name };
}

/* ── ჯგუფის მენიუ: რეჟიმი + მიმართულება ── */
function groupMenu(){
  const p = pool();
  if (!p.sec) return go({ name:"home" });
  const k = countKnown(p.sec, p.list);
  const left = p.list.filter(x => !knownIn(ck(p.sec, x.grp, x.card), dir)).length;

  app.innerHTML = `
    <div class="top">
      <button class="back" data-back>←</button>
      <div class="ttl">${esc(p.title)}<small>${plural(p.list.length)} · 🏆 ${k.full} ვიცი${k.half ? " · ½ " + k.half : ""}</small></div>
    </div>

    <div class="seg">
      <button data-dir="en" class="${dir === "en" ? "on" : ""}">EN → ქარ</button>
      <button data-dir="ka" class="${dir === "ka" ? "on" : ""}">ქარ → EN</button>
    </div>
    <div class="hint">${dir === "en"
      ? "ინგლისურს ხედავ — ქართული უნდა გაიხსენო."
      : "ქართულს ხედავ — ინგლისური უნდა გაიხსენო."}<br>
      ამ მიმართულებით გასამეორებელია <b>${left}</b> ბარათი.</div>

    <div class="cubes">
      <button class="btn" data-m="cards">📇 ბარათები</button>
      <button class="btn ghost" data-m="quiz">✍️ ტესტი</button>
    </div>

    ${k.full || k.half ? `<div style="text-align:center;margin-top:18px">
      <button class="mini" data-reset>ამ ჯგუფის პროგრესის გასუფთავება</button></div>` : ``}

    <div class="foot">„ვიცი“ ორივე მიმართულებით ცალკე ითვლება —<br>
      🏆 მხოლოდ მაშინ, როცა EN→ქარ და ქარ→EN ორივე მონიშნულია.</div>`;

  app.querySelector("[data-back]").onclick = () => go({ name:"section", sec:p.sec.id });
  app.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => {
    dir = b.dataset.dir;
    try { localStorage.setItem("myeng.dir", dir); } catch(e){}
    render();
  });
  app.querySelector("[data-m=cards]").onclick = () => go({ name:"cards", sec:view.sec, grp:view.grp, i:0, flip:false, deck:null });
  app.querySelector("[data-m=quiz]").onclick = () => go({ name:"quiz", sec:view.sec, grp:view.grp, qi:0, score:0, qs:null });
  const r = app.querySelector("[data-reset]");
  if (r) r.onclick = () => {
    if (!confirm("ამ ჯგუფის „ვიცი“ ნიშნულები წაიშლება. გავაგრძელო?")) return;
    p.list.forEach(x => unmark(ck(p.sec, x.grp, x.card)));
    render();
  };
}

/* ── ბარათები ── */
function buildDeck(p){
  const todo = p.list.filter(x => !knownIn(ck(p.sec, x.grp, x.card), dir));
  return { items: shuffle(todo.length ? todo : p.list), repeat: todo.length === 0 };
}

function cards(){
  const p = pool();
  if (!p.sec || !p.list.length) return go({ name:"section", sec:view.sec });
  if (!view.deck) view.deck = buildDeck(p);
  const deck = view.deck.items;

  if (view.i >= deck.length){
    const k = countKnown(p.sec, p.list);
    app.innerHTML = `
      <div class="top">
        <button class="back" data-back>←</button>
        <div class="ttl">${esc(p.title)}<small>დასტა დასრულდა</small></div>
      </div>
      <div class="score"><div class="big">👏</div>
        <div class="sub">ამ წრეზე <b>${deck.length}</b> ბარათი გაიარე.<br>
        სულ ჯგუფში 🏆 <b>${k.full}</b> ბარათი ნამდვილად იცი${k.half ? `, ნახევრად — ${k.half}` : ``}.</div></div>
      <div class="row">
        <button class="btn" data-again>🔁 თავიდან</button>
        <button class="btn ghost" data-back2>ჯგუფები</button>
      </div>`;
    app.querySelector("[data-back]").onclick =
    app.querySelector("[data-back2]").onclick = () => go({ name:"group", sec:view.sec, grp:view.grp });
    app.querySelector("[data-again]").onclick = () => go({ name:"cards", sec:view.sec, grp:view.grp, i:0, flip:false, deck:null });
    return;
  }

  const x = deck[view.i];
  const key = ck(p.sec, x.grp, x.card);
  const s = st(key);
  const front = dir === "en" ? x.card.en : x.card.ka;
  const back  = dir === "en" ? x.card.ka : x.card.en;
  const speakText = x.card.en;

  const faceFront = `
    <div class="side">${dir === "en" ? "ინგლისური" : "ქართული"}</div>
    ${s.en || s.ka ? `<div class="badge">${s.en && s.ka ? "🏆" : "½"}</div>` : ``}
    ${dir === "en" ? `<button class="spk" data-spk>🔊</button>` : ``}
    <div class="main ${dir === "ka" ? "ge" : ""}">${esc(front)}</div>
    <div class="tap">დააჭირე პასუხისთვის</div>`;

  const faceBack = `
    <div class="side">პასუხი</div>
    <button class="spk" data-spk>🔊</button>
    <div class="ans ${dir === "en" ? "ge" : ""}">${esc(back)}</div>
    ${x.card.ex ? `<div class="ex">${esc(x.card.ex)}</div>` : ``}
    ${x.card.exka ? `<div class="exka">${esc(x.card.exka)}</div>` : ``}
    <div class="tap">${esc(front)}</div>`;

  app.innerHTML = `
    <div class="top">
      <button class="back" data-back>←</button>
      <div class="ttl">${esc(p.title)}<small>${dir === "en" ? "EN → ქარ" : "ქარ → EN"}${view.deck.repeat ? " · ყველაფერი ნასწავლია, გამეორება" : ""}</small></div>
    </div>
    <div class="count">${view.i + 1} / ${deck.length}${x.grp && view.grp === "__all" ? " · " + esc(x.grp.name) : ""}</div>
    <div class="card" data-card>${view.flip ? faceBack : faceFront}</div>
    <div class="row" style="margin-bottom:10px">
      <button class="btn ghost" data-skip>🔁 გასამეორებელი</button>
      <button class="btn" data-know>✅ ვიცი</button>
    </div>
    <div class="row">
      <button class="mini" data-prev>← წინა</button>
      <button class="mini" data-next>შემდეგი →</button>
    </div>
    <div class="foot">„✅ ვიცი“ ნიშნავს: ამ მიმართულებით გამახსენდა.</div>`;

  app.querySelector("[data-card]").onclick = e => {
    if (e.target.closest("[data-spk]")) return;
    view.flip = !view.flip; render();
  };
  const spk = app.querySelector("[data-spk]");
  if (spk) spk.onclick = e => { e.stopPropagation(); say(speakText); };
  app.querySelector("[data-back]").onclick = () => go({ name:"group", sec:view.sec, grp:view.grp });
  app.querySelector("[data-know]").onclick = () => { mark(key, dir); view.i++; view.flip = false; render(); };
  app.querySelector("[data-skip]").onclick = () => { view.i++; view.flip = false; render(); };
  app.querySelector("[data-next]").onclick = () => { view.i++; view.flip = false; render(); };
  app.querySelector("[data-prev]").onclick = () => { if (view.i > 0) view.i--; view.flip = false; render(); };

  if (dir === "en" && !view.flip) { /* ავტომატურად არ ვკითხულობ — ხმა მხოლოდ ღილაკით */ }
}

/* ── ტესტი ── */
function buildQuiz(p){
  const pick = shuffle(p.list).slice(0, 20);
  return pick.map(x => {
    const correct = dir === "en" ? x.card.ka : x.card.en;
    const others = shuffle(p.list.filter(y => y.card.en !== x.card.en))
      .slice(0, 3)
      .map(y => ({ text: dir === "en" ? y.card.ka : y.card.en, owner: y.card }));
    const opts = shuffle([{ text: correct, owner: x.card, ok: true }].concat(others));
    return { x, opts, answered: false, chosen: -1 };
  });
}

function quiz(){
  const p = pool();
  if (!p.sec || p.list.length < 2){
    app.innerHTML = `<div class="top"><button class="back" data-back>←</button>
      <div class="ttl">ტესტი</div></div>
      <div class="empty">ტესტისთვის სულ მცირე 2 ბარათია საჭირო.</div>`;
    app.querySelector("[data-back]").onclick = () => go({ name:"group", sec:view.sec, grp:view.grp });
    return;
  }
  if (!view.qs) view.qs = buildQuiz(p);
  const qs = view.qs;

  if (view.qi >= qs.length){
    const pct = Math.round(view.score / qs.length * 100);
    app.innerHTML = `
      <div class="top"><button class="back" data-back>←</button>
        <div class="ttl">${esc(p.title)}<small>ტესტი დასრულდა</small></div></div>
      <div class="score">
        <div class="big">${view.score} / ${qs.length}</div>
        <div class="sub">${pct}% სწორი პასუხი${pct >= 80 ? " — ძალიან კარგი! 🎉" : pct >= 50 ? " — კიდევ ცოტა გამეორება 💪" : " — ბარათებით გაიარე ეს ჯგუფი 📇"}</div>
      </div>
      <div class="row">
        <button class="btn" data-again>🔁 თავიდან</button>
        <button class="btn ghost" data-cards>📇 ბარათები</button>
      </div>`;
    app.querySelector("[data-back]").onclick = () => go({ name:"group", sec:view.sec, grp:view.grp });
    app.querySelector("[data-again]").onclick = () => go({ name:"quiz", sec:view.sec, grp:view.grp, qi:0, score:0, qs:null });
    app.querySelector("[data-cards]").onclick = () => go({ name:"cards", sec:view.sec, grp:view.grp, i:0, flip:false, deck:null });
    return;
  }

  const q = qs[view.qi];
  const question = dir === "en" ? q.x.card.en : q.x.card.ka;

  let fb = "";
  if (q.answered){
    const chosen = q.opts[q.chosen];
    const right = q.opts.find(o => o.ok);
    if (chosen.ok){
      fb = `<div class="fb"><span class="ok">✅ სწორია!</span>
        ${q.x.card.ex ? `<div class="belongs">${esc(q.x.card.ex)}${q.x.card.exka ? `<br><span style="opacity:.65">${esc(q.x.card.exka)}</span>` : ``}</div>` : ``}</div>`;
    } else {
      fb = `<div class="fb"><span class="no">❌ არასწორია.</span>
        <div style="margin-top:6px"><b>${esc(q.x.card.en)}</b> = ${esc(q.x.card.ka)}</div>
        <div class="belongs">შენ რომ აირჩიე — „${esc(chosen.text)}“ — ეს სინამდვილეში
          <b>${esc(dir === "en" ? chosen.owner.en : chosen.owner.ka)}</b>-ს ეკუთვნის.</div>
        ${q.x.card.ex ? `<div class="belongs">${esc(q.x.card.ex)}${q.x.card.exka ? `<br><span style="opacity:.65">${esc(q.x.card.exka)}</span>` : ``}</div>` : ``}</div>`;
    }
  }

  app.innerHTML = `
    <div class="top"><button class="back" data-back>←</button>
      <div class="ttl">${esc(p.title)}<small>ტესტი · ${dir === "en" ? "EN → ქარ" : "ქარ → EN"} · ქულა ${view.score}</small></div></div>
    <div class="count">${view.qi + 1} / ${qs.length}</div>
    <div class="q ${dir === "ka" ? "ge" : ""}">
      ${dir === "en" ? `<button class="spk" data-spk>🔊</button>` : ``}
      ${esc(question)}
    </div>
    <div class="opts">
      ${q.opts.map((o,i) => {
        let cls = "opt";
        if (q.answered){
          if (o.ok) cls += " right";
          else if (i === q.chosen) cls += " wrong";
        }
        return `<button class="${cls}" data-o="${i}" ${q.answered ? "disabled" : ""}>${esc(o.text)}</button>`;
      }).join("")}
    </div>
    ${fb}
    ${q.answered ? `<div style="margin-top:12px"><button class="btn" data-nextq>შემდეგი →</button></div>` : ``}`;

  app.querySelector("[data-back]").onclick = () => go({ name:"group", sec:view.sec, grp:view.grp });
  const spk = app.querySelector("[data-spk]");
  if (spk) spk.onclick = () => say(q.x.card.en);
  app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
    if (q.answered) return;
    q.answered = true; q.chosen = +b.dataset.o;
    if (q.opts[q.chosen].ok) view.score++;
    render();
  });
  const nq = app.querySelector("[data-nextq]");
  if (nq) nq.onclick = () => { view.qi++; render(); };
}

/* ── პროგრესი ── */
function progress(){
  const rows = DATA.sections.map(sec => {
    const list = allCards(sec);
    const k = countKnown(sec, list);
    const pct = list.length ? Math.round(k.full / list.length * 100) : 0;
    return `<div class="cube">
      <div class="nm">${sec.icon} ${esc(sec.name)}</div>
      <div class="mt"><span><b>${list.length}</b> ბარათი</span>
        <span class="kn">🏆 ${k.full}</span>${k.half ? `<span>½ ${k.half}</span>` : ``}
        <span>${pct}%</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>`;
  }).join("");

  const total = DATA.sections.reduce((n,s) => n + allCards(s).length, 0);
  const tot = DATA.sections.reduce((n,s) => n + countKnown(s, allCards(s)).full, 0);

  app.innerHTML = `
    <div class="top"><button class="back" data-back>←</button>
      <div class="ttl">📊 პროგრესი<small>🏆 = ორივე მიმართულებით ვიცი</small></div></div>
    <div class="score"><div class="big">${tot} / ${total}</div>
      <div class="sub">ნამდვილად ნასწავლი ბარათი</div></div>
    <div class="cubes">${rows}</div>
    <div style="text-align:center;margin-top:18px">
      <button class="mini" data-clear>მთელი პროგრესის გასუფთავება</button></div>
    <div class="foot">პროგრესი ამ ტელეფონის ბრაუზერში ინახება.<br>ბრაუზერის მონაცემების გასუფთავება მას შლის.</div>`;

  app.querySelector("[data-back]").onclick = () => go({ name:"home" });
  app.querySelector("[data-clear]").onclick = () => {
    if (!confirm("მთელი პროგრესი („ვიცი“ ნიშნულები) წაიშლება. გავაგრძელო?")) return;
    know = {}; save(); render();
  };
}

render();

/* ── ოფლაინ რეჟიმი ── */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
