<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFC93C">
<meta name="description" content="ჩემი განვლილი ინგლისური მასალა — ბარათებით და ტესტით გამეორება.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My English">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>My English</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap">
<style>
  :root{
    --yellow:#FFC93C;
    --navy:#1b2438;
    --white:#ffffff;
    --line:#e6e1d4;
    --green:#1f9d55;
    --red:#d64545;
    --shadow:0 4px 14px rgba(27,36,56,.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--yellow); color:var(--navy);
    font-family:"Noto Sans Georgian","Segoe UI",system-ui,sans-serif;
    font-size:16px; line-height:1.45;
  }
  .wrap{
    max-width:430px; margin:0 auto; min-height:100vh;
    padding:14px 16px calc(28px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
  }

  /* სათაური */
  .top{display:flex; align-items:center; gap:10px; margin-bottom:14px; min-height:40px}
  .back{
    flex:0 0 auto; width:40px; height:40px; border:none; border-radius:12px;
    background:rgba(255,255,255,.55); color:var(--navy); font-size:20px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .back:active{background:rgba(255,255,255,.9)}
  .ttl{font-size:19px; font-weight:700; line-height:1.2; flex:1 1 auto}
  .ttl small{display:block; font-size:12px; font-weight:500; opacity:.72; margin-top:2px}
  .logo{font-size:26px; font-weight:700; letter-spacing:-.5px}
  .logo span{background:var(--navy); color:var(--yellow); padding:0 8px; border-radius:10px}

  /* კუბიკები */
  .cubes{display:flex; flex-direction:column; gap:12px}
  .cube{
    display:block; width:100%; text-align:left; border:none; cursor:pointer;
    background:var(--white); border-radius:18px; padding:16px 18px;
    box-shadow:var(--shadow); color:var(--navy); font-family:inherit; font-size:16px;
  }
  .cube:active{transform:scale(.985)}
  .cube .ic{font-size:26px; line-height:1}
  .cube .nm{font-size:18px; font-weight:700; margin-top:6px}
  .cube .ds{font-size:13px; opacity:.7; margin-top:2px}
  .cube .mt{font-size:13px; margin-top:8px; display:flex; gap:12px; flex-wrap:wrap}
  .mt b{font-weight:600}
  .mt .kn{color:var(--green); font-weight:700}
  .cube.flat{background:rgba(255,255,255,.6); box-shadow:none; border:1px dashed rgba(27,36,56,.25)}
  .cube.small{padding:13px 16px}
  .cube.small .nm{font-size:16px; margin-top:0}
  .cube.dim{opacity:.6}

  .bar{height:7px; background:#eee8d8; border-radius:99px; overflow:hidden; margin-top:10px}
  .bar i{display:block; height:100%; background:var(--green); border-radius:99px; transition:width .3s}

  .empty{
    background:rgba(255,255,255,.6); border:1px dashed rgba(27,36,56,.3);
    border-radius:16px; padding:18px; font-size:14px; text-align:center; opacity:.9;
  }

  /* რეჟიმი */
  .seg{display:flex; gap:8px; background:rgba(255,255,255,.5); padding:5px; border-radius:14px; margin-bottom:14px}
  .seg button{
    flex:1; border:none; background:transparent; font-family:inherit; font-size:14px;
    font-weight:600; color:var(--navy); padding:9px 4px; border-radius:10px; cursor:pointer;
  }
  .seg button.on{background:var(--navy); color:var(--yellow)}
  .hint{font-size:12.5px; opacity:.75; margin:-6px 0 14px; text-align:center}

  .btn{
    border:none; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer;
    background:var(--navy); color:var(--yellow); border-radius:14px; padding:14px;
    width:100%; box-shadow:var(--shadow);
  }
  .btn.ghost{background:var(--white); color:var(--navy); box-shadow:none; border:1px solid var(--line)}
  .btn[disabled]{opacity:.45; cursor:default}
  .btn:active{opacity:.85}
  .row{display:flex; gap:10px}
  .row > *{flex:1}

  /* ბარათი */
  .count{text-align:center; font-size:13px; font-weight:600; opacity:.8; margin-bottom:8px}
  .card{
    background:var(--white); border-radius:22px; box-shadow:var(--shadow);
    min-height:260px; padding:30px 20px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; cursor:pointer;
    position:relative; margin-bottom:14px;
  }
  .card .side{font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.45; position:absolute; top:14px; left:0; right:0}
  .card .main{font-size:25px; font-weight:700; line-height:1.3; word-break:break-word}
  .card .main.ge{font-size:22px}
  .card .ans{font-size:21px; font-weight:700; line-height:1.35}
  .card .ex{font-size:14.5px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); opacity:.9; font-style:italic}
  .card .exka{font-size:13.5px; margin-top:5px; opacity:.65}
  .card .tap{position:absolute; bottom:14px; left:0; right:0; font-size:12px; opacity:.45; padding:0 12px}
  .spk{
    position:absolute; top:12px; right:12px; width:40px; height:40px; border-radius:50%;
    border:none; background:var(--yellow); color:var(--navy); font-size:19px; cursor:pointer;
  }
  .badge{position:absolute; top:14px; left:14px; font-size:12px; font-weight:700; color:var(--green)}

  /* ტესტი */
  .q{
    background:var(--white); border-radius:18px; box-shadow:var(--shadow);
    padding:24px 18px; text-align:center; font-size:21px; font-weight:700; margin-bottom:12px;
    position:relative; min-height:86px; display:flex; align-items:center; justify-content:center;
  }
  .q.ge{font-size:18px}
  .opts{display:flex; flex-direction:column; gap:9px}
  .opt{
    border:1px solid var(--line); background:var(--white); color:var(--navy);
    font-family:inherit; font-size:15px; text-align:left; padding:13px 15px;
    border-radius:14px; cursor:pointer; line-height:1.35;
  }
  .opt.right{background:#e7f7ec; border-color:var(--green); font-weight:700}
  .opt.wrong{background:#fdeaea; border-color:var(--red)}
  .fb{margin-top:12px; background:var(--white); border-radius:14px; padding:14px 16px; font-size:14px; box-shadow:var(--shadow)}
  .fb .ok{color:var(--green); font-weight:700}
  .fb .no{color:var(--red); font-weight:700}
  .fb .belongs{margin-top:8px; padding-top:8px; border-top:1px solid var(--line)}

  .score{background:var(--white); border-radius:18px; box-shadow:var(--shadow); padding:24px; text-align:center; margin-bottom:14px}
  .score .big{font-size:40px; font-weight:700; line-height:1.1}
  .score .sub{font-size:14px; opacity:.75; margin-top:6px}

  /* სია და მონიშვნა */
  .lrow{
    display:flex; gap:12px; align-items:flex-start; background:var(--white);
    border-radius:14px; padding:12px 14px; margin-bottom:8px; cursor:pointer;
    border:2px solid transparent;
  }
  .lrow.on{border-color:var(--navy); background:#fffaf0}
  .lrow .box{
    flex:0 0 auto; width:22px; height:22px; border-radius:7px; border:2px solid rgba(27,36,56,.3);
    display:flex; align-items:center; justify-content:center; font-size:14px; margin-top:2px;
  }
  .lrow.on .box{background:var(--navy); color:var(--yellow); border-color:var(--navy)}
  .lrow .tx{flex:1 1 auto; min-width:0}
  .lrow .en{font-weight:700; font-size:15px; word-break:break-word}
  .lrow .ka{font-size:13px; opacity:.75; margin-top:2px}
  .lrow .pl{font-size:11.5px; opacity:.6; margin-top:4px}
  .lrow .gear{flex:0 0 auto; font-size:17px; opacity:.5; padding:2px 0 0 4px}

  .sticky{
    position:sticky; bottom:0; padding:10px 0 calc(6px + env(safe-area-inset-bottom));
    background:linear-gradient(to bottom, rgba(255,201,60,0), var(--yellow) 35%);
  }
  .sechip{display:flex; gap:8px; margin-bottom:12px}
  .sechip button{
    flex:1; border:1px solid var(--line); background:var(--white); color:var(--navy);
    font-family:inherit; font-size:13px; font-weight:600; padding:11px 4px; border-radius:12px; cursor:pointer;
  }
  .sechip button.on{background:var(--navy); color:var(--yellow); border-color:var(--navy)}

  .sub{font-size:13px; font-weight:700; opacity:.8; margin:16px 0 8px}
  textarea{
    width:100%; min-height:120px; border-radius:12px; border:1px solid var(--line);
    padding:10px; font-family:ui-monospace,monospace; font-size:11px; resize:vertical;
  }
  .foot{margin-top:auto; padding-top:20px; font-size:11.5px; text-align:center; opacity:.6}
  .mini{
    border:none; background:transparent; font-family:inherit; font-size:13px;
    color:var(--navy); opacity:.75; text-decoration:underline; cursor:pointer; padding:6px;
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="data.js"></script>
<script>
"use strict";

/* ═════════════ შენახვა ═════════════ */
const K_KNOW = "myeng.know.v2";    // {cid: {en:1, ka:1}}
const K_PLACE = "myeng.place.v1";  // {cid: {sec, grp}}
const K_GRP = "myeng.groups.v1";   // [{id,name,icon}]  ხატიას დამატებული ჯგუფები
const K_GNAME = "myeng.gname.v1";  // {grpId: "ახალი სახელი"}
const K_DIR = "myeng.dir";

function load(k, dflt){
  try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? dflt : v; }
  catch(e){ return dflt; }
}
function store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

let know  = load(K_KNOW, {});
let place = load(K_PLACE, {});
let ugrps = load(K_GRP, []);
let gname = load(K_GNAME, {});
let dir   = "en";
try { dir = localStorage.getItem(K_DIR) || "en"; } catch(e){}

/* ═════════════ მონაცემები ═════════════ */
const SECS = DATA.sections;

/* ბარათის პირადი ნომერი — ინგლისური ტექსტი. ჯგუფის შეცვლა პროგრესს არ შლის. */
function cid(c){ return String(c.en).trim().toLowerCase(); }

function groups(){
  return DATA.groups.concat(ugrps).map(g => ({
    id: g.id, icon: g.icon || "📘", name: gname[g.id] || g.name
  }));
}
function grpName(id){ const g = groups().find(g => g.id === id); return g ? g.name : "—"; }
function grpIcon(id){ const g = groups().find(g => g.id === id); return g ? g.icon : "📘"; }
function secName(id){ const s = SECS.find(s => s.id === id); return s ? s.name : "—"; }

function placeOf(c){
  const p = place[cid(c)];
  if (p) return { sec: p.sec || null, grp: p.grp || null };
  return { sec: c.sec || null, grp: c.grp || null };
}
function setPlace(c, sec, grp){ place[cid(c)] = { sec: sec, grp: grp }; }
function placed(c){ const p = placeOf(c); return !!(p.sec && p.grp); }

function cardsOf(secId, grpId){
  return DATA.cards.filter(c => {
    const p = placeOf(c);
    if (!p.sec || !p.grp) return false;
    if (p.sec !== secId) return false;
    return grpId === "__all" ? true : p.grp === grpId;
  });
}
function inbox(){ return DATA.cards.filter(c => !placed(c)); }
function themesOf(list){
  const out = [];
  list.forEach(c => { const t = c.src || "სხვა"; if (out.indexOf(t) < 0) out.push(t); });
  return out;
}

/* პროგრესი */
function sOf(c){ return know[cid(c)] || {}; }
function knownIn(c, d){ return !!sOf(c)[d]; }
function knownBoth(c){ const s = sOf(c); return !!s.en && !!s.ka; }
function mark(c, d){ const k = cid(c); (know[k] || (know[k] = {}))[d] = 1; store(K_KNOW, know); }
function unmarkAll(list){ list.forEach(c => { delete know[cid(c)]; }); store(K_KNOW, know); }
function stats(list){
  let full = 0, half = 0;
  list.forEach(c => { if (knownBoth(c)) full++; else if (sOf(c).en || sOf(c).ka) half++; });
  return { full: full, half: half, n: list.length };
}

/* ═════════════ ხმა (ამერიკული აქცენტი) ═════════════ */
let voices = [];
function loadVoices(){ try { voices = speechSynthesis.getVoices() || []; } catch(e){ voices = []; } }
if (window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function say(text){
  if (!window.speechSynthesis || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = .9;
    const v = voices.find(v => /en[-_]US/i.test(v.lang) && /female|samantha|zira|aria|jenny/i.test(v.name))
           || voices.find(v => /en[-_]US/i.test(v.lang))
           || voices.find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e){}
}

/* ═════════════ ხელსაწყოები ═════════════ */
const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function shuffle(a){ const r = a.slice(); for (let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }

let view = { name:"home" };
let sel = {};                       /* მონიშნული ბარათები: cid -> true */
function selCount(){ return Object.keys(sel).length; }
function clearSel(){ sel = {}; }

function go(v){ view = v; render(); window.scrollTo(0,0); }
function head(title, note, backView){
  return `<div class="top">
    ${backView ? `<button class="back" data-back>←</button>` : ``}
    <div class="ttl">${title}${note ? `<small>${note}</small>` : ``}</div></div>`;
}
function wireBack(backView){
  const b = app.querySelector("[data-back]");
  if (b) b.onclick = () => go(backView);
}

function render(){
  const f = {
    home: home, section: section, group: groupMenu, cards: cards, quiz: quiz,
    inboxThemes: inboxThemes, list: list, assign: assign, grpAdmin: grpAdmin, progress: progress
  }[view.name] || home;
  f();
}

/* ═════════════ მთავარი ═════════════ */
function home(){
  const inb = inbox();
  const cubes = SECS.map(s => {
    const list = cardsOf(s.id, "__all");
    const st = stats(list);
    const gN = groups().filter(g => cardsOf(s.id, g.id).length).length;
    return `<button class="cube" data-sec="${esc(s.id)}">
      <div class="ic">${s.icon}</div>
      <div class="nm">${esc(s.name)}</div>
      <div class="ds">${esc(s.note || "")}</div>
      <div class="mt"><span><b>${list.length}</b> ბარათი</span>
        <span><b>${gN}</b> ჯგუფი</span>
        ${st.full ? `<span class="kn">🏆 ${st.full}</span>` : ``}</div>
    </button>`;
  }).join("");

  const tot = DATA.cards.length;
  const totFull = stats(DATA.cards).full;

  app.innerHTML =
    `<div class="top"><div class="ttl"><div class="logo">My <span>English</span></div>
      <small>ჩემი მასალა — ${tot} ბარათი</small></div></div>` +
    `<div class="cubes">${cubes}
      ${inb.length ? `<button class="cube" data-go="inboxThemes" style="background:#1b2438;color:#FFC93C">
        <div class="ic">📥</div>
        <div class="nm" style="color:#FFC93C">გასანაწილებელი — ${inb.length}</div>
        <div class="ds" style="color:#FFC93C;opacity:.8">ჯგუფი ჯერ არ მინიჭებული ბარათები</div>
      </button>` : ``}
      <button class="cube flat small" data-go="grpAdmin"><div class="nm">⚙️ ჯგუფები</div></button>
      <button class="cube flat small" data-go="progress"><div class="nm">📊 პროგრესი — 🏆 ${totFull} / ${tot}</div></button>
    </div>` +
    `<div class="foot">ბარათის წინა მხარეს პასუხი არ ჩანს —<br>თვითონ დაფიქრდი, მერე დააჭირე.</div>`;

  app.querySelectorAll("[data-sec]").forEach(b =>
    b.onclick = () => go({ name:"section", sec:b.dataset.sec }));
  app.querySelectorAll("[data-go]").forEach(b =>
    b.onclick = () => { clearSel(); go({ name:b.dataset.go }); });
}

/* ═════════════ განყოფილება → ჯგუფები ═════════════ */
function section(){
  const s = SECS.find(x => x.id === view.sec);
  if (!s) return go({ name:"home" });
  const gs = groups();
  const all = cardsOf(s.id, "__all");

  const cubes = gs.map(g => {
    const list = cardsOf(s.id, g.id);
    const st = stats(list);
    const pct = list.length ? Math.round(st.full / list.length * 100) : 0;
    return `<button class="cube ${list.length ? "" : "dim"}" data-grp="${esc(g.id)}">
      <div class="nm">${g.icon} ${esc(g.name)}</div>
      <div class="mt"><span><b>${list.length}</b> ბარათი</span>
        ${st.full ? `<span class="kn">🏆 ${st.full}</span>` : ``}
        ${st.half ? `<span>½ ${st.half}</span>` : ``}</div>
      ${list.length ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ``}
    </button>`;
  }).join("");

  app.innerHTML =
    head(`${s.icon} ${esc(s.name)}`, esc(s.note || ""), { name:"home" }) +
    (all.length ? "" : `<div class="empty" style="margin-bottom:12px">ამ განყოფილებაში ჯერ ბარათი არ არის.<br>
      „📥 გასანაწილებელიდან" მიანიჭე ჯგუფი და აქ გამოჩნდება.</div>`) +
    `<div class="cubes">${cubes}
      ${all.length ? `<button class="cube flat" data-grp="__all">
        <div class="nm">🎲 ყველა ჯგუფი ერთად</div>
        <div class="mt"><span><b>${all.length}</b> ბარათი</span></div></button>` : ``}
    </div>`;

  wireBack({ name:"home" });
  app.querySelectorAll("[data-grp]").forEach(b =>
    b.onclick = () => go({ name:"group", sec:s.id, grp:b.dataset.grp }));
}

/* ═════════════ ჯგუფის მენიუ ═════════════ */
function poolOf(v){
  const list = cardsOf(v.sec, v.grp);
  const title = v.grp === "__all" ? "🎲 ყველა ჯგუფი" : grpIcon(v.grp) + " " + grpName(v.grp);
  return { list: list, title: title };
}

function groupMenu(){
  const p = poolOf(view);
  const st = stats(p.list);
  const left = p.list.filter(c => !knownIn(c, dir)).length;
  const back = { name:"section", sec:view.sec };

  app.innerHTML =
    head(esc(p.title), `${secName(view.sec)} · ${st.n} ბარათი · 🏆 ${st.full}${st.half ? " · ½ " + st.half : ""}`, back) +
    `<div class="seg">
      <button data-dir="en" class="${dir === "en" ? "on" : ""}">EN → ქარ</button>
      <button data-dir="ka" class="${dir === "ka" ? "on" : ""}">ქარ → EN</button>
    </div>
    <div class="hint">${dir === "en"
      ? "ინგლისურს ხედავ — ქართული უნდა გაიხსენო."
      : "ქართულს ხედავ — ინგლისური უნდა გაიხსენო."}<br>
      ამ მიმართულებით გასამეორებელია <b>${left}</b> ბარათი.</div>` +
    (st.n ? `<div class="cubes">
      <button class="btn" data-m="cards">📇 ბარათები</button>
      <button class="btn ghost" data-m="quiz">✍️ ტესტი</button>
      ${view.grp === "__all" ? `` : `<button class="cube flat small" data-m="sort">
        <div class="nm">🗂 ბარათების სია / ჯგუფის შეცვლა</div></button>`}
    </div>` : `<div class="empty">ჯერ ბარათი არ არის.</div>`) +
    (st.full || st.half ? `<div style="text-align:center;margin-top:16px">
      <button class="mini" data-reset>ამ ჯგუფის პროგრესის გასუფთავება</button></div>` : ``) +
    `<div class="foot">🏆 მხოლოდ მაშინ, როცა EN→ქარ და ქარ→EN<br>ორივე მიმართულებით მონიშნავ (ერთი მხარე = ½).</div>`;

  wireBack(back);
  app.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => {
    dir = b.dataset.dir;
    try { localStorage.setItem(K_DIR, dir); } catch(e){}
    render();
  });
  const m = app.querySelectorAll("[data-m]");
  m.forEach(b => b.onclick = () => {
    if (b.dataset.m === "cards") go({ name:"cards", sec:view.sec, grp:view.grp, i:0, flip:false, deck:null });
    if (b.dataset.m === "quiz")  go({ name:"quiz",  sec:view.sec, grp:view.grp, qi:0, score:0, qs:null });
    if (b.dataset.m === "sort"){ clearSel(); go({ name:"list", kind:"grp", sec:view.sec, grp:view.grp, back:{ name:"group", sec:view.sec, grp:view.grp } }); }
  });
  const r = app.querySelector("[data-reset]");
  if (r) r.onclick = () => {
    if (!confirm("ამ ჯგუფის „ვიცი“ ნიშნულები წაიშლება. გავაგრძელო?")) return;
    unmarkAll(p.list); render();
  };
}

/* ═════════════ ბარათები ═════════════ */
function cards(){
  const p = poolOf(view);
  if (!p.list.length) return go({ name:"section", sec:view.sec });
  if (!view.deck){
    const todo = p.list.filter(c => !knownIn(c, dir));
    view.deck = { items: shuffle(todo.length ? todo : p.list), repeat: todo.length === 0 };
  }
  const deck = view.deck.items;
  const back = { name:"group", sec:view.sec, grp:view.grp };

  if (view.i >= deck.length){
    const st = stats(p.list);
    app.innerHTML =
      head(esc(p.title), "დასტა დასრულდა", back) +
      `<div class="score"><div class="big">👏</div>
        <div class="sub">ამ წრეზე <b>${deck.length}</b> ბარათი გაიარე.<br>
        სულ 🏆 <b>${st.full}</b> ბარათი ნამდვილად იცი${st.half ? `, ნახევრად — ${st.half}` : ``}.</div></div>
      <div class="row"><button class="btn" data-again>🔁 თავიდან</button>
        <button class="btn ghost" data-back2>ჯგუფი</button></div>`;
    wireBack(back);
    app.querySelector("[data-back2]").onclick = () => go(back);
    app.querySelector("[data-again]").onclick = () => go({ name:"cards", sec:view.sec, grp:view.grp, i:0, flip:false, deck:null });
    return;
  }

  const c = deck[view.i];
  const s = sOf(c);
  const front = dir === "en" ? c.en : c.ka;
  const backT = dir === "en" ? c.ka : c.en;

  const face = view.flip
    ? `<div class="side">პასუხი</div>
       <button class="spk" data-spk>🔊</button>
       <div class="ans ${dir === "en" ? "ge" : ""}">${esc(backT)}</div>
       ${c.ex ? `<div class="ex">${esc(c.ex)}</div>` : ``}
       ${c.exka ? `<div class="exka">${esc(c.exka)}</div>` : ``}
       <div class="tap">${esc(front)}</div>`
    : `<div class="side">${dir === "en" ? "ინგლისური" : "ქართული"}</div>
       ${s.en || s.ka ? `<div class="badge">${s.en && s.ka ? "🏆" : "½"}</div>` : ``}
       ${dir === "en" ? `<button class="spk" data-spk>🔊</button>` : ``}
       <div class="main ${dir === "ka" ? "ge" : ""}">${esc(front)}</div>
       <div class="tap">დააჭირე პასუხისთვის</div>`;

  app.innerHTML =
    head(esc(p.title), `${dir === "en" ? "EN → ქარ" : "ქარ → EN"}${view.deck.repeat ? " · გამეორება" : ""}`, back) +
    `<div class="count">${view.i + 1} / ${deck.length}${view.grp === "__all" ? " · " + esc(grpName(placeOf(c).grp)) : ""}</div>
    <div class="card" data-card>${face}</div>
    <div class="row" style="margin-bottom:10px">
      <button class="btn ghost" data-skip>🔁 გასამეორებელი</button>
      <button class="btn" data-know>✅ ვიცი</button></div>
    <div class="row">
      <button class="mini" data-prev>← წინა</button>
      <button class="mini" data-move>🗂 ჯგუფის შეცვლა</button>
      <button class="mini" data-next>შემდეგი →</button></div>`;

  wireBack(back);
  app.querySelector("[data-card]").onclick = e => {
    if (e.target.closest("[data-spk]")) return;
    view.flip = !view.flip; render();
  };
  const spk = app.querySelector("[data-spk]");
  if (spk) spk.onclick = e => { e.stopPropagation(); say(c.en); };
  app.querySelector("[data-know]").onclick = () => { mark(c, dir); view.i++; view.flip = false; render(); };
  app.querySelector("[data-skip]").onclick = () => { view.i++; view.flip = false; render(); };
  app.querySelector("[data-next]").onclick = () => { view.i++; view.flip = false; render(); };
  app.querySelector("[data-prev]").onclick = () => { if (view.i > 0) view.i--; view.flip = false; render(); };
  app.querySelector("[data-move]").onclick = () => {
    clearSel(); sel[cid(c)] = true;
    go({ name:"assign", back:{ name:"cards", sec:view.sec, grp:view.grp, i:view.i, flip:false, deck:null } });
  };
}

/* ═════════════ ტესტი ═════════════ */
function quiz(){
  const p = poolOf(view);
  const back = { name:"group", sec:view.sec, grp:view.grp };
  if (p.list.length < 2){
    app.innerHTML = head("ტესტი", "", back) + `<div class="empty">ტესტისთვის სულ მცირე 2 ბარათია საჭირო.</div>`;
    return wireBack(back);
  }
  if (!view.qs){
    view.qs = shuffle(p.list).slice(0, 20).map(c => {
      const others = shuffle(p.list.filter(y => cid(y) !== cid(c))).slice(0, 3)
        .map(y => ({ text: dir === "en" ? y.ka : y.en, owner: y }));
      return { c: c, answered: false, chosen: -1,
        opts: shuffle([{ text: dir === "en" ? c.ka : c.en, owner: c, ok: true }].concat(others)) };
    });
  }
  const qs = view.qs;

  if (view.qi >= qs.length){
    const pct = Math.round(view.score / qs.length * 100);
    app.innerHTML =
      head(esc(p.title), "ტესტი დასრულდა", back) +
      `<div class="score"><div class="big">${view.score} / ${qs.length}</div>
        <div class="sub">${pct}% სწორი${pct >= 80 ? " — ძალიან კარგი! 🎉" : pct >= 50 ? " — კიდევ ცოტა გამეორება 💪" : " — ბარათებით გაიარე 📇"}</div></div>
      <div class="row"><button class="btn" data-again>🔁 თავიდან</button>
        <button class="btn ghost" data-cards>📇 ბარათები</button></div>`;
    wireBack(back);
    app.querySelector("[data-again]").onclick = () => go({ name:"quiz", sec:view.sec, grp:view.grp, qi:0, score:0, qs:null });
    app.querySelector("[data-cards]").onclick = () => go({ name:"cards", sec:view.sec, grp:view.grp, i:0, flip:false, deck:null });
    return;
  }

  const q = qs[view.qi];
  const question = dir === "en" ? q.c.en : q.c.ka;
  let fb = "";
  if (q.answered){
    const ch = q.opts[q.chosen];
    const exBlock = q.c.ex ? `<div class="belongs">${esc(q.c.ex)}${q.c.exka ? `<br><span style="opacity:.65">${esc(q.c.exka)}</span>` : ``}</div>` : ``;
    fb = ch.ok
      ? `<div class="fb"><span class="ok">✅ სწორია!</span>${exBlock}</div>`
      : `<div class="fb"><span class="no">❌ არასწორია.</span>
          <div style="margin-top:6px"><b>${esc(q.c.en)}</b> = ${esc(q.c.ka)}</div>
          <div class="belongs">შენ რომ აირჩიე — „${esc(ch.text)}“ — ეს სინამდვილეში
            <b>${esc(dir === "en" ? ch.owner.en : ch.owner.ka)}</b>-ს ეკუთვნის.</div>${exBlock}</div>`;
  }

  app.innerHTML =
    head(esc(p.title), `ტესტი · ${dir === "en" ? "EN → ქარ" : "ქარ → EN"} · ქულა ${view.score}`, back) +
    `<div class="count">${view.qi + 1} / ${qs.length}</div>
    <div class="q ${dir === "ka" ? "ge" : ""}">${dir === "en" ? `<button class="spk" data-spk>🔊</button>` : ``}${esc(question)}</div>
    <div class="opts">${q.opts.map((o,i) => {
      let cls = "opt";
      if (q.answered){ if (o.ok) cls += " right"; else if (i === q.chosen) cls += " wrong"; }
      return `<button class="${cls}" data-o="${i}" ${q.answered ? "disabled" : ""}>${esc(o.text)}</button>`;
    }).join("")}</div>${fb}
    ${q.answered ? `<div style="margin-top:12px"><button class="btn" data-nextq>შემდეგი →</button></div>` : ``}`;

  wireBack(back);
  const spk = app.querySelector("[data-spk]");
  if (spk) spk.onclick = () => say(q.c.en);
  app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
    if (q.answered) return;
    q.answered = true; q.chosen = +b.dataset.o;
    if (q.opts[q.chosen].ok) view.score++;
    render();
  });
  const nq = app.querySelector("[data-nextq]");
  if (nq) nq.onclick = () => { view.qi++; render(); };
}

/* ═════════════ ბარათების სია + მონიშვნა ═════════════ */
function listRows(){
  if (view.kind === "theme") return inbox().filter(c => (c.src || "სხვა") === view.theme);
  return cardsOf(view.sec, view.grp);
}

function list(){
  const rows = listRows();
  const back = view.back || { name:"home" };
  const title = view.kind === "theme" ? esc(view.theme) : esc(grpIcon(view.grp) + " " + grpName(view.grp));
  const n = selCount();

  app.innerHTML =
    head(title, `${rows.length} ბარათი${n ? ` · მონიშნული ${n}` : ""}`, back) +
    `<div class="row" style="margin-bottom:12px">
      <button class="btn ghost" data-all>${n === rows.length && n ? "✖️ მონიშვნის მოხსნა" : "✔️ ყველას მონიშვნა"}</button>
    </div>` +
    (rows.length ? rows.map(c => {
      const p = placeOf(c);
      const on = !!sel[cid(c)];
      return `<div class="lrow ${on ? "on" : ""}" data-c="${esc(cid(c))}">
        <div class="box">${on ? "✓" : ""}</div>
        <div class="tx">
          <div class="en">${esc(c.en)}</div>
          <div class="ka">${esc(c.ka)}</div>
          <div class="pl">${p.sec && p.grp
            ? `${esc(secName(p.sec))} · ${esc(grpName(p.grp))}`
            : `📥 ჯგუფი არ აქვს`}${c.src ? ` · ${esc(c.src)}` : ``}</div>
        </div>
        <div class="gear" data-one="${esc(cid(c))}">🗂</div>
      </div>`;
    }).join("") : `<div class="empty">ბარათი არ არის.</div>`) +
    (n ? `<div class="sticky"><button class="btn" data-move>🗂 მონიშნული ${n} ბარათს ჯგუფის მინიჭება</button></div>` : ``) +
    `<div class="foot">ბარათზე დააჭირე — მოინიშნება.<br>🗂 ნიშნავს მხოლოდ ამ ერთი ბარათის გადატანას.</div>`;

  wireBack(back);
  app.querySelector("[data-all]").onclick = () => {
    if (selCount() === rows.length) clearSel();
    else rows.forEach(c => { sel[cid(c)] = true; });
    render();
  };
  app.querySelectorAll("[data-c]").forEach(el => el.onclick = e => {
    const one = e.target.closest("[data-one]");
    if (one){
      clearSel(); sel[one.dataset.one] = true;
      return go({ name:"assign", back:view });
    }
    const k = el.dataset.c;
    if (sel[k]) delete sel[k]; else sel[k] = true;
    render();
  });
  const mv = app.querySelector("[data-move]");
  if (mv) mv.onclick = () => go({ name:"assign", back:view });
}

/* ═════════════ ჯგუფის მინიჭება / შეცვლა ═════════════ */
function assign(){
  const picked = DATA.cards.filter(c => sel[cid(c)]);
  const back = view.back || { name:"home" };
  if (!picked.length) return go(back);

  if (!view.pSec || !view.pGrp){
    const first = placeOf(picked[0]);
    view.pSec = view.pSec || first.sec || null;
    view.pGrp = view.pGrp || first.grp || null;
  }

  app.innerHTML =
    head("🗂 ჯგუფის მინიჭება", `${picked.length} ბარათი`, back) +
    `<div class="sub">1. რომელ განყოფილებაში?</div>
    <div class="sechip">${SECS.map(s =>
      `<button data-ps="${esc(s.id)}" class="${view.pSec === s.id ? "on" : ""}">${s.icon}<br>${esc(s.name)}</button>`
    ).join("")}</div>
    <div class="sub">2. რომელ ჯგუფში?</div>
    <div class="cubes">${groups().map(g =>
      `<button class="cube small ${view.pGrp === g.id ? "" : "flat"}" data-pg="${esc(g.id)}"
        style="${view.pGrp === g.id ? "background:#1b2438;color:#FFC93C" : ""}">
        <div class="nm" style="${view.pGrp === g.id ? "color:#FFC93C" : ""}">${g.icon} ${esc(g.name)}</div></button>`
    ).join("")}
      <button class="cube flat small" data-newg><div class="nm">➕ ახალი ჯგუფი</div></button>
    </div>
    <div class="sticky">
      <button class="btn" data-save ${view.pSec && view.pGrp ? "" : "disabled"}>
        ✅ ${picked.length} ბარათი → ${view.pSec ? esc(secName(view.pSec)) : "…"} / ${view.pGrp ? esc(grpName(view.pGrp)) : "…"}</button>
      <div style="text-align:center"><button class="mini" data-inbox>📥 გასანაწილებელში დაბრუნება</button></div>
    </div>
    <div class="foot">პირველი 3 ბარათი: ${picked.slice(0,3).map(c => esc(c.en)).join(" · ")}${picked.length > 3 ? " …" : ""}</div>`;

  wireBack(back);
  app.querySelectorAll("[data-ps]").forEach(b => b.onclick = () => { view.pSec = b.dataset.ps; render(); });
  app.querySelectorAll("[data-pg]").forEach(b => b.onclick = () => { view.pGrp = b.dataset.pg; render(); });
  app.querySelector("[data-newg]").onclick = () => {
    const nm = (prompt("ახალი ჯგუფის სახელი:") || "").trim();

    const g = { id: "u" + Date.now(), name: nm, icon: "📘" };

    if (!view.pSec || !view.pGrp) return;
    picked.forEach(c => setPlace(c, view.pSec, view.pGrp));

    clearSel();
    go(back.name === "list" && back.kind === "theme" ? { name:"inboxThemes" } : back);
  };
  app.querySelector("[data-inbox]").onclick = () => {
    picked.forEach(c => setPlace(c, null, null));
    store(K_PLACE, place);
    clearSel(); go(back);
  };
}

    const nm = (prompt("ჯგუფის ახალი სახელი:", grpName(id)) || "").trim();
    if (!nm) return;
    gname[id] = nm; store(K_GNAME, gname); render();
  });
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const id = b.dataset.del;
    if (!confirm("ჯგუფი „" + grpName(id) + "“ წაიშლება. გავაგრძელო?")) return;
    ugrps = ugrps.filter(g => g.id !== id); store(K_GRP, ugrps);
    delete gname[id]; store(K_GNAME, gname); render();
  });
  app.querySelector("[data-copy]").onclick = () => {
    const ta = document.getElementById("exp");
    try {
      if (navigator.clipboard) navigator.clipboard.writeText(ta.value);
      else { ta.select(); document.execCommand("copy"); }
      alert("დაკოპირდა ✅");
    } catch(e){ ta.select(); }
  };
}

/* ═════════════ პროგრესი ═════════════ */
function progress(){
  const back = { name:"home" };
  const rows = SECS.map(s => {
    const list = cardsOf(s.id, "__all");
    const st = stats(list);
    const pct = list.length ? Math.round(st.full / list.length * 100) : 0;
    return `<div class="cube">
      <div class="nm">${s.icon} ${esc(s.name)}</div>
      <div class="mt"><span><b>${list.length}</b> ბარათი</span>
        <span class="kn">🏆 ${st.full}</span>${st.half ? `<span>½ ${st.half}</span>` : ``}
        <span>${pct}%</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
  const all = stats(DATA.cards);
  const inb = inbox().length;

  app.innerHTML =
    head("📊 პროგრესი", "🏆 = ორივე მიმართულებით ვიცი", back) +
    `<div class="score"><div class="big">${all.full} / ${all.n}</div>
      <div class="sub">ნამდვილად ნასწავლი ბარათი${all.half ? ` · ნახევრად ${all.half}` : ``}
      ${inb ? `<br>📥 გასანაწილებელში — ${inb}` : ``}</div></div>
    <div class="cubes">${rows}</div>
    <div style="text-align:center;margin-top:16px">
      <button class="mini" data-clear>მთელი პროგრესის გასუფთავება</button></div>
    <div class="foot">პროგრესი და ჯგუფების დალაგება ამ ტელეფონის ბრაუზერში ინახება.</div>`;

  wireBack(back);
  app.querySelector("[data-clear]").onclick = () => {
    if (!confirm("მთელი პროგრესი („ვიცი“ ნიშნულები) წაიშლება. ჯგუფები რჩება. გავაგრძელო?")) return;
    know = {}; store(K_KNOW, know); render();
  };
}

render();

/* ოფლაინ რეჟიმი */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
